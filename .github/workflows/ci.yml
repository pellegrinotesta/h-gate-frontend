name: Frontend CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-h-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp-h-gate/package-lock.json
      - run: npm ci
      - name: Build
        run: npx ng build --configuration production
      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
